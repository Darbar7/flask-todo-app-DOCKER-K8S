version: '3.8'
services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_NAME=todo_db
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
    depends_on:
      - db
    networks:
      - todo-network

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=todo_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - todo-network

volumes:
  pgdata:

networks:
  todo-network:
