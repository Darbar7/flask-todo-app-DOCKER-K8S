<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps To-Do App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input[type="text"] { width: 70%; padding: 10px; }
        input[type="submit"] { padding: 10px 20px; background: #007BFF; color: white; border: none; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h2>My Dockerized Task List</h2>
        <form action="/add" method="POST">
            <input type="text" name="title" placeholder="Enter a new DevOps task..." required>
            <input type="submit" value="Add Task">
        </form>
        <ul>
            {% for task in tasks %}
                <li>✅ {{ task[1] }}</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
